<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="760" fill="#fbf8f1"/>

  <rect x="20" y="20" width="920" height="210" rx="10" fill="#eef4ea" stroke="#6d8f5c"/>
  <text x="36" y="44" font-size="15" font-weight="bold" fill="#33502a">oozx-plugins</text>
  <text x="150" y="44" fill="#33502a">everything that plugs in: seventy-five plugins, each one small module</text>
  <g fill="#ffffff" stroke="#6d8f5c">
    <rect x="36" y="58" width="168" height="156" rx="6"/>
    <rect x="216" y="58" width="168" height="156" rx="6"/>
    <rect x="396" y="58" width="168" height="156" rx="6"/>
    <rect x="576" y="58" width="168" height="156" rx="6"/>
    <rect x="756" y="58" width="168" height="156" rx="6"/>
  </g>
  <g fill="#1f1f1f">
    <text x="48" y="80" font-weight="bold">Machines</text>
    <text x="48" y="100">128, +2, +3, Pentagon,</text>
    <text x="48" y="117">Timex, Inves, Chloe…</text>
    <text x="48" y="141" fill="#555">each one says its ROMs,</text>
    <text x="48" y="158" fill="#555">its paging, its timing</text>
    <text x="48" y="175" fill="#555">and what is on its board</text>

    <text x="228" y="80" font-weight="bold">Peripherals</text>
    <text x="228" y="100">drives, printers, mice,</text>
    <text x="228" y="117">sound boxes, hard disks</text>
    <text x="228" y="141" fill="#555">ports it answers, memory</text>
    <text x="228" y="158" fill="#555">it pages in, sound it</text>
    <text x="228" y="175" fill="#555">makes, and its window</text>

    <text x="408" y="80" font-weight="bold">Formats</text>
    <text x="408" y="100">Z80, SNA, SZX, SP, EZX,</text>
    <text x="408" y="117">TAP, TZX, PZX, disks</text>
    <text x="408" y="141" fill="#555">a format is a table:</text>
    <text x="408" y="158" fill="#555">which byte of the file is</text>
    <text x="408" y="175" fill="#555">which part of the machine</text>

    <text x="588" y="80" font-weight="bold">Mappings</text>
    <text x="588" y="100">what a file carries of</text>
    <text x="588" y="117">each peripheral</text>
    <text x="588" y="141" fill="#555">knows the file and the</text>
    <text x="588" y="158" fill="#555">part, so neither knows</text>
    <text x="588" y="175" fill="#555">the other; the session</text>
    <text x="588" y="192" fill="#555">is made of these</text>

    <text x="768" y="80" font-weight="bold">Tools</text>
    <text x="768" y="100">game browser, catalogue,</text>
    <text x="768" y="117">pokes, map, debugger,</text>
    <text x="768" y="134">tracer, guide</text>
    <text x="768" y="158" fill="#555">look at a machine from</text>
    <text x="768" y="175" fill="#555">outside, through what</text>
    <text x="768" y="192" fill="#555">it already says</text>
  </g>

  <g stroke="#555" fill="none" marker-end="url(#a)">
    <path d="M120 230V262"/><path d="M300 230V262"/><path d="M480 230V262"/><path d="M660 230V262"/><path d="M840 230V262"/>
  </g>
  <text x="852" y="251" fill="#555" font-size="12">plug into</text>

  <rect x="20" y="264" width="920" height="300" rx="10" fill="#eaf0f7" stroke="#5c7a9f"/>
  <text x="36" y="288" font-size="15" font-weight="bold" fill="#27425f">oozx</text>
  <text x="84" y="288" fill="#27425f">the Z80, the Spectrum, the fast core and the desk</text>

  <rect x="36" y="302" width="590" height="176" rx="6" fill="#ffffff" stroke="#5c7a9f"/>
  <text x="48" y="323" font-weight="bold">A machine</text>
  <text x="128" y="323" fill="#555">one graph of objects; six machines are six graphs, nothing shared</text>
  <g fill="#f4f7fb" stroke="#5c7a9f">
    <rect x="48" y="336" width="130" height="58" rx="5"/>
    <rect x="190" y="336" width="130" height="58" rx="5"/>
    <rect x="332" y="336" width="130" height="58" rx="5"/>
    <rect x="474" y="336" width="140" height="58" rx="5"/>
    <rect x="48" y="406" width="130" height="58" rx="5"/>
    <rect x="190" y="406" width="130" height="58" rx="5"/>
    <rect x="332" y="406" width="130" height="58" rx="5"/>
    <rect x="474" y="406" width="140" height="58" rx="5"/>
  </g>
  <g fill="#1f1f1f">
    <text x="58" y="358" font-weight="bold">Memory bus</text><text x="58" y="378" fill="#555">banks in slots</text>
    <text x="200" y="358" font-weight="bold">Port bus</text><text x="200" y="378" fill="#555">who answers a port</text>
    <text x="342" y="358" font-weight="bold">ULA and display</text><text x="342" y="378" fill="#555">the beam draws it</text>
    <text x="484" y="358" font-weight="bold">Clock</text><text x="484" y="378" fill="#555">T-states, contention</text>
    <text x="58" y="428" font-weight="bold">Sound mix</text><text x="58" y="448" fill="#555">beeper, AY, others</text>
    <text x="200" y="428" font-weight="bold">Keyboard</text><text x="200" y="448" fill="#555">the matrix</text>
    <text x="342" y="428" font-weight="bold">Peripherals</text><text x="342" y="448" fill="#555">what is plugged in</text>
    <text x="484" y="428" font-weight="bold">Settings</text><text x="484" y="448" fill="#555">each part's, by name</text>
  </g>

  <rect x="36" y="490" width="286" height="60" rx="6" fill="#ffffff" stroke="#5c7a9f"/>
  <text x="48" y="512" font-weight="bold">The Z80, as objects</text>
  <text x="48" y="532" fill="#555">instructions, operands, registers</text>
  <rect x="340" y="490" width="286" height="60" rx="6" fill="#ffffff" stroke="#5c7a9f"/>
  <text x="352" y="512" font-weight="bold">The fast core</text>
  <text x="352" y="532" fill="#555">generated from those objects</text>
  <path d="M338 520H324" stroke="#555" fill="none" marker-end="url(#a)"/>
  <path d="M180 480V488" stroke="#555" fill="none" marker-end="url(#a)"/>
  <path d="M484 480V488" stroke="#555" fill="none" marker-end="url(#a)"/>

  <rect x="644" y="302" width="280" height="112" rx="6" fill="#ffffff" stroke="#5c7a9f"/>
  <text x="656" y="323" font-weight="bold">The desk</text>
  <text x="656" y="344" fill="#555">a window is the thing: a machine,</text>
  <text x="656" y="361" fill="#555">a peripheral's front, a tool.</text>
  <text x="656" y="378" fill="#555">Where a window sits is what it</text>
  <text x="656" y="395" fill="#555">is plugged into</text>
  <rect x="644" y="426" width="280" height="124" rx="6" fill="#ffffff" stroke="#5c7a9f"/>
  <text x="656" y="447" font-weight="bold">Windows and the picture</text>
  <text x="656" y="468" fill="#555">scalers, the television, the kit a</text>
  <text x="656" y="485" fill="#555">peripheral's window is made from.</text>
  <text x="656" y="509" fill="#555">Depends on nothing of the</text>
  <text x="656" y="526" fill="#555">emulator</text>
  <path d="M642 358H628" stroke="#555" fill="none" marker-end="url(#a)"/>
  <path d="M784 414V424" stroke="#555" fill="none" marker-end="url(#a)"/>

  <path d="M784 564V596" stroke="#555" fill="none" marker-end="url(#a)"/>
  <path d="M300 564V596" stroke="#555" fill="none" marker-end="url(#a)"/>
  <rect x="490" y="598" width="450" height="68" rx="10" fill="#f6efe2" stroke="#a5855a"/>
  <text x="506" y="622" font-size="15" font-weight="bold" fill="#5e4420">plugdesk</text>
  <text x="506" y="644" fill="#5e4420">a desk for any application: windows, menus made of what the</text>
  <text x="506" y="659" fill="#5e4420">plugins offer, looks, the plugin window. Knows no Spectrum</text>
  <rect x="20" y="598" width="450" height="68" rx="10" fill="#f6efe2" stroke="#a5855a"/>
  <text x="36" y="622" font-size="15" font-weight="bold" fill="#5e4420">crystal-plugins</text>
  <text x="36" y="644" fill="#5e4420">finds the plugins, loads each with its own libraries, and hands</text>
  <text x="36" y="659" fill="#5e4420">a role everything that plays it. Knows no desk</text>
  <path d="M490 632H472" stroke="#555" fill="none" marker-end="url(#a)"/>

  <rect x="20" y="690" width="920" height="52" rx="10" fill="#ffffff" stroke="#999"/>
  <text x="36" y="712" font-weight="bold">On your disk</text>
  <text x="36" y="731" fill="#555">the session, a snapshot for each machine with every peripheral's state inside · your settings · the games fetched for you · plugins</text>

  <text x="540" y="585" text-anchor="middle" fill="#555" font-size="12">an arrow says "knows"; nothing knows upwards</text>
</svg>
