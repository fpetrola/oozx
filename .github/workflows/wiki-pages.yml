name: Wiki

on:
  push:
    branches: [main]
    paths: ['doc/wiki/**', '.github/workflows/wiki-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: touch doc/wiki/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/wiki
      - id: deployment
        uses: actions/deploy-pages@v4
