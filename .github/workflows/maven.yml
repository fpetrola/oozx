# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # El framework de plugins contra el que se compila. No publica artefactos a ningun
    # repositorio, asi que su arbol se construye aca, igual que hace el repo de plugins con este.
    #
    # A un tag y no a su rama: lo que se empuje alla mientras se trabaja no tiene por que voltear
    # el build de aca. El tag se mueve cuando este arbol esta listo para tomar una version nueva.
    - uses: actions/checkout@v4
      with:
        repository: fpetrola/crystal-plugins
        ref: offers-4
        path: crystal-plugins

    # 21 y no 18: el framework se compila con release 21, y modulos de aca tambien. El pom
    # raiz sigue pidiendo 18 de lenguaje, que un javac 21 compila sin problema.
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build the plugin framework
      run: mvn -B -U -DskipTests install -f crystal-plugins/pom.xml

    # Sin los plugins adentro: son otro repositorio, aca no estan, y este build no publica nada.
    # Vacio apaga el empaquetado; con el groupId puesto y ninguno encontrado, el build falla.
    - name: Build with Maven
      run: mvn -B -U verify --file pom.xml -Dcrystal.bundleGroupId=
  
    
       
