# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # El framework de plugins contra el que se compila. No publica artefactos a ningun
    # repositorio, asi que su arbol se construye aca, igual que hace el repo de plugins con este.
    - uses: actions/checkout@v4
      with:
        repository: fpetrola/crystal-plugins
        path: crystal-plugins

    - name: Set up JDK 18
      uses: actions/setup-java@v4
      with:
        java-version: '18'
        distribution: 'temurin'
        cache: maven
    - name: Build the plugin framework
      run: mvn -B -U -DskipTests install -f crystal-plugins/pom.xml

    - name: Build with Maven
      run: mvn -B -U package --file pom.xml
  
    
       
