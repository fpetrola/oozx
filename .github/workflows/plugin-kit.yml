# The two small jars somebody writing a plugin needs, published on every push to main: the word
# a way in is marked with, and what writes the paperwork while their jar compiles.
#
# The plugins themselves are not here any more - they are their own repository, and publish
# themselves the same way from there.
name: Plugin kit

on:
  push:
    branches: [main]
    paths:
      - 'emulator/**'
      - 'machine/**'
      - 'pom.xml'
      - '.github/workflows/plugin-kit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-kit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The whole reactor once: a device jar is small, but it is compiled against the machine.
      # Running the tests is the other workflow's job; this one only produces the artefacts.
      - name: Build
        run: mvn -B -DskipTests install

      - name: Find the two jars
        id: list
        run: |
          python3 - <<'PY'
          import json, os, re, glob, shutil, sys

          def artifact_of(pom):
              """The module's own artifactId, which is the one outside <parent>."""
              text = re.sub(r'<parent>.*?</parent>', '', open(pom).read(), flags=re.S)
              found = re.search(r'<artifactId>([^<]+)</artifactId>', text)
              return found.group(1) if found else None

          os.makedirs('jars', exist_ok=True)
          devices = []
          for pom in ['plugin-api/pom.xml', 'plugin-processor/pom.xml']:
              module = os.path.dirname(pom)
              artifact = artifact_of(pom)
              jars = [j for j in glob.glob(module + '/target/' + artifact + '-*.jar')
                      if not j.endswith(('-sources.jar', '-javadoc.jar'))]
              if not jars:
                  print('no jar for ' + artifact, file=sys.stderr)
                  continue
              shutil.copy(jars[0], 'jars/')
              # Neither has a window, so neither has a name of its own: the module's will do.
              devices.append({'artifact': artifact, 'title': os.path.basename(module).capitalize()})

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('devices=' + json.dumps(devices) + '\n')
          PY

      - name: Keep the jars
        uses: actions/upload-artifact@v4
        with:
          name: device-jars
          path: jars
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        device: ${{ fromJson(needs.build.outputs.devices) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: device-jars

      # Each board gets a release of its own, named after the board rather than after the module,
      # and recreated rather than added to: what is published is always what main builds today.
      - name: Publish ${{ matrix.device.artifact }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.device.artifact }}
          TITLE: ${{ matrix.device.title }}
        run: |
          JAR=$(ls "$TAG"-*.jar | head -1)
          echo "publishing $TAG from $JAR"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          {
            echo "**$TITLE** for [OOZX](https://github.com/$GITHUB_REPOSITORY), built from \`main\` at"
            echo "[\`${GITHUB_SHA:0:9}\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)."
            echo
            echo "What somebody writing a plugin compiles against. How to write one, and every way"
            echo "in there is, are in"
            echo "[Extending OOZX](https://github.com/$GITHUB_REPOSITORY/wiki/Extending-OOZX)."
            echo
            echo "The plugins themselves are [oozx-plugins](https://github.com/fpetrola/oozx-plugins)."
          } > notes.md
          gh release create "$TAG" "$JAR" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file notes.md
